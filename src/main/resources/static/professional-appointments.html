<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My appointments (professional) — Appointment System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
    <a href="dashboard.html" class="brand">Appointment System</a>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="#" id="logout-link">Log out</a>
    </nav>
</div>
<div class="page-wrap">
    <h1>Appointments booked with me</h1>
    <p>Confirm or cancel the appointments users have requested with you.</p>

    <div id="list" class="result-list"></div>
    <div class="empty-state" id="empty" style="display:none;">
        <p>No appointments booked with you yet.</p>
    </div>
    <div class="status-msg" id="status"></div>
</div>
<script src="js/api.js"></script>
<script>
    requireAuth();
    document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });

    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const statusEl = document.getElementById("status");

    function statusBadgeClass(status) {
        if (status === "CONFIRMED") return "badge badge-ok";
        if (status === "CANCELLED") return "badge badge-error";
        return "badge badge-pending";
    }

    function formatDate(dateTimeStr) {
        const d = new Date(dateTimeStr);
        return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    }

    async function updateStatus(id, newStatus) {
        try {
            await apiFetch(`/api/appointments/${id}`, {
                method: "PATCH",
                body: JSON.stringify({ status: newStatus }),
            });
            showStatus(statusEl, `Appointment ${newStatus.toLowerCase()}.`, "ok");
            loadAppointments();
        } catch (err) {
            showStatus(statusEl, "Could not update appointment: " + err.message, "error");
        }
    }

    async function loadAppointments() {
        listEl.innerHTML = "";
        try {
            const appointments = await apiFetch("/api/appointments/mine/professional");

            if (!appointments.length) {
                emptyEl.style.display = "block";
                return;
            }
            emptyEl.style.display = "none";

            appointments.forEach((appt) => {
                const row = document.createElement("div");
                row.className = "result-row";

                const info = document.createElement("div");

                const nameEl = document.createElement("strong");
                nameEl.textContent = `${appt.user.firstName} ${appt.user.lastName}`;

                const badge = document.createElement("span");
                badge.className = statusBadgeClass(appt.status);
                badge.textContent = appt.status;

                const dateEl = document.createElement("p");
                dateEl.textContent = formatDate(appt.dateTime);

                const contactEl = document.createElement("p");
                contactEl.textContent = `${appt.user.email} · ${appt.user.phone ?? ""}`;

                // un espacio entre el nombre y el badge, como en el HTML original
                info.append(nameEl, " ", badge, dateEl, contactEl);

                const actions = document.createElement("div");
                actions.className = "row-actions";

                if (appt.status === "PENDING") {
                    const confirmBtn = document.createElement("button");
                    confirmBtn.className = "confirm-btn";
                    confirmBtn.textContent = "Confirm";
                    confirmBtn.addEventListener("click", () => updateStatus(appt.id, "CONFIRMED"));

                    const cancelBtn = document.createElement("button");
                    cancelBtn.className = "secondary cancel-btn";
                    cancelBtn.textContent = "Cancel";
                    cancelBtn.addEventListener("click", () => updateStatus(appt.id, "CANCELLED"));

                    actions.append(confirmBtn, cancelBtn);
                }

                row.append(info, actions);
                listEl.appendChild(row);
            });
        } catch (err) {
            showStatus(statusEl, "Could not load your appointments: " + err.message, "error");
        }
    }

    loadAppointments();
</script>
</body>
</html>
