<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional profile — Appointment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="brand">Appointment System</a>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="#" id="logout-link">Log out</a>
  </nav>
</div>

<div class="center-stage" style="min-height: calc(100vh - 130px);">
  <div class="ticket">
    <div class="ticket-head">
      <div class="eyebrow" id="eyebrow">Profile</div>
      <h1 id="title">Become a professional</h1>
      <p id="subtitle">Add your specialty so other users can find you.</p>
    </div>
    <hr class="ticket-divider">
    <div class="ticket-body">

      <form id="profile-form" novalidate style="display:none;">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" required>

        <label for="lastName">Last name</label>
        <input type="text" id="lastName" required>

        <label for="phone">Phone</label>
        <input type="text" id="phone" required>

        <label for="specialty">Specialty</label>
        <input type="text" id="specialty" placeholder="E.g. Dentist, Welder..." required>

        <label for="yearsOfExperience">Years of experience</label>
        <input type="number" id="yearsOfExperience" min="0" required>

        <label for="available">Available to take appointments</label>
        <input type="checkbox" id="available" checked>

        <button type="submit" id="profile-submit-btn">Create professional profile</button>
        <div class="status-msg" id="profile-status"></div>
      </form>

      <div id="remove-panel" style="display:none;">
        <p id="remove-info"></p>
        <button id="remove-btn" class="danger">Remove profile</button>
        <div class="status-msg" id="remove-status"></div>
      </div>

    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  requireAuth();
  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });

  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode") === "remove" ? "remove"
          : params.get("mode") === "edit" ? "edit"
                  : "create";

  const form = document.getElementById("profile-form");
  const submitBtn = document.getElementById("profile-submit-btn");
  const statusEl = document.getElementById("profile-status");

  async function initCreateOrEdit() {
    form.style.display = "block";

    if (mode === "create") {
      try {
        const myUser = await getMyUser();
        const firstNameInput = document.getElementById("firstName");
        const lastNameInput = document.getElementById("lastName");
        firstNameInput.value = myUser.firstName ?? "";
        lastNameInput.value = myUser.lastName ?? "";
        firstNameInput.disabled = true;
        lastNameInput.disabled = true;
      } catch {
      }
    }

    if (mode === "edit") {
      document.getElementById("title").textContent = "Edit professional profile";
      document.getElementById("subtitle").textContent = "Update your professional info.";
      submitBtn.textContent = "Save changes";

      const profile = await getMyProfessional();
      if (!profile) {
        form.style.display = "none";
        showStatus(statusEl, "You don't have a professional profile yet. Create one first.", "error");
        return;
      }
      document.getElementById("firstName").value = profile.firstName ?? "";
      document.getElementById("lastName").value = profile.lastName ?? "";
      document.getElementById("phone").value = profile.phone ?? "";
      document.getElementById("specialty").value = profile.specialty ?? "";
      document.getElementById("yearsOfExperience").value = profile.yearsOfExperience ?? 0;
      document.getElementById("available").checked = !!profile.available;
    }
  }

  async function initRemove() {
    document.getElementById("title").textContent = "Stop being a professional";
    document.getElementById("subtitle").textContent = "This removes your existing professional profile.";
    document.getElementById("remove-panel").style.display = "block";

    const infoEl = document.getElementById("remove-info");
    const removeBtn = document.getElementById("remove-btn");
    const removeStatusEl = document.getElementById("remove-status");

    const profile = await getMyProfessional();
    if (!profile) {
      infoEl.textContent = "You don't have a professional profile to remove.";
      removeBtn.style.display = "none";
      return;
    }
    infoEl.textContent = `You're about to remove your profile as ${profile.specialty} (${profile.firstName} ${profile.lastName}).`;

    removeBtn.addEventListener("click", async () => {
      if (!confirm("Remove your professional profile?")) return;
      try {
        await apiFetch(`/api/professionals/${profile.id}`, { method: "DELETE" });
        showStatus(removeStatusEl, "Professional profile removed.", "ok");
        removeBtn.style.display = "none";
      } catch (err) {
        showStatus(removeStatusEl, "We couldn't remove the profile: " + err.message, "error");
      }
    });
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const payload = {
      firstName: document.getElementById("firstName").value.trim(),
      lastName: document.getElementById("lastName").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      specialty: document.getElementById("specialty").value.trim(),
      yearsOfExperience: Number(document.getElementById("yearsOfExperience").value),
      available: document.getElementById("available").checked,
    };

    try {
      if (mode === "edit") {
        const profile = await getMyProfessional();
        await apiFetch(`/api/professionals/${profile.id}`, {
          method: "PATCH",
          body: JSON.stringify(payload),
        });
        showStatus(statusEl, "Professional profile updated.", "ok");
      } else {
        await apiFetch("/api/professionals/me", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        showStatus(statusEl, "Professional profile created successfully.", "ok");
        event.target.reset();
      }
    } catch (err) {
      showStatus(statusEl, "Something went wrong: " + err.message, "error");
    }
  });

  if (mode === "remove") {
    initRemove();
  } else {
    initCreateOrEdit();
  }
</script>
</body>
</html>
