<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional profile — Appointment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="brand">Appointment System</a>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="#" id="logout-link">Log out</a>
  </nav>
</div>

<div class="center-stage" style="min-height: calc(100vh - 130px);">
  <div class="ticket">
    <div class="ticket-head">
      <div class="eyebrow" id="eyebrow">Profile</div>
      <h1 id="title">Become a professional</h1>
      <p id="subtitle">Add your specialty so other users can find you.</p>
    </div>
    <hr class="ticket-divider">
    <div class="ticket-body">

      <form id="create-form" novalidate>
        <label for="firstName">First name</label>
        <input type="text" id="firstName" required>

        <label for="lastName">Last name</label>
        <input type="text" id="lastName" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="4">

        <label for="specialty">Specialty</label>
        <input type="text" id="specialty" placeholder="E.g. Dentist, Welder..." required>

        <button type="submit">Create professional profile</button>
        <div class="status-msg" id="create-status"></div>
      </form>

      <form id="remove-form" novalidate style="display:none;">
        <label for="professionalId">Professional profile ID</label>
        <input type="number" id="professionalId" min="1" required>
        <div class="field-error">
          Note: until the Account-Professional relationship exists, you have
          to enter the ID manually. Once it's implemented, this will fill in
          automatically.
        </div>

        <button type="submit" class="danger">Deactivate</button>
        <div class="status-msg" id="remove-status"></div>
      </form>

    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  requireAuth();
  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });

  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode") === "remove" ? "remove" : "create";

  if (mode === "remove") {
    document.getElementById("title").textContent = "Stop being a professional";
    document.getElementById("subtitle").textContent = "This deactivates your existing professional profile.";
    document.getElementById("create-form").style.display = "none";
    document.getElementById("remove-form").style.display = "block";
  }

  document.getElementById("create-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const statusEl = document.getElementById("create-status");

    const payload = {
      firstName: document.getElementById("firstName").value.trim(),
      lastName: document.getElementById("lastName").value.trim(),
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
      specialty: document.getElementById("specialty").value.trim(),
    };

    try {
      await apiFetch("/api/professionals", {
        method: "POST",
        body: JSON.stringify(payload),
      });
      showStatus(statusEl, "Professional profile created successfully.", "ok");
      event.target.reset();
    } catch (err) {
      showStatus(statusEl, "We couldn't create the profile: " + err.message, "error");
    }
  });

  document.getElementById("remove-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const statusEl = document.getElementById("remove-status");
    const id = document.getElementById("professionalId").value;

    try {
      await apiFetch(`/api/professionals/${id}`, { method: "DELETE" });
      showStatus(statusEl, "Professional profile deactivated.", "ok");
      event.target.reset();
    } catch (err) {
      showStatus(statusEl, "We couldn't deactivate the profile: " + err.message, "error");
    }
  });
</script>
</body>
</html>
