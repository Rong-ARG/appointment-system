<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a professional — Appointment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <a href="dashboard.html" class="brand">Appointment System</a>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="#" id="logout-link">Log out</a>
  </nav>
</div>
<div class="page-wrap">
  <h1>Find a professional</h1>
  <p>We show every registered professional. Filter by specialty to find someone specific.</p>
  <div class="search-row">
    <label for="specialty-input" class="sr-only">Search by specialty</label>
    <input type="text" id="specialty-input" placeholder="Search by specialty (e.g. Doc)">
    <button id="search-btn">Search</button>
    <button id="clear-btn" class="secondary">View all</button>
  </div>
  <div id="results" class="result-list"></div>
  <div id="empty" class="empty-state" style="display:none;">No professionals matched that search.</div>
</div>
<script src="js/api.js"></script>
<script>
  requireAuth();
  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });
  const resultsEl = document.getElementById("results");
  const emptyEl = document.getElementById("empty");
  function renderResults(list) {
    resultsEl.innerHTML = "";
    if (!list || list.length === 0) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";
    list.forEach((prof) => {
      const row = document.createElement("div");
      row.className = "result-row";
      row.innerHTML = `
        <div>
          <div class="name">${prof.firstName ?? ""} ${prof.lastName ?? ""}</div>
          <div class="meta">${prof.specialty ?? prof.email ?? ""}</div>
        </div>
        <button class="request-btn" data-id="${prof.id}">Request appointment</button>
      `;
      resultsEl.appendChild(row);
    });

    resultsEl.querySelectorAll(".request-btn").forEach((btn) => {
      btn.addEventListener("click", () => requestAppointment(btn.dataset.id));
    });
  }

  async function requestAppointment(professionalId) {
    const dateTimeStr = prompt("Date and time for the appointment (e.g. 2026-09-15T14:30):");
    if (!dateTimeStr) return;
    try {
      const userId = await getMyUserId();
      await apiFetch("/api/appointments", {
        method: "POST",
        body: JSON.stringify({
          userId,
          professionalId: Number(professionalId),
          dateTime: dateTimeStr,
          status: "PENDING"
        })
      });
      alert("Appointment requested! You can see it in \"My appointments\".");
    } catch (err) {
      alert("Could not request appointment: " + err.message);
    }
  }
  async function loadAll() {
    try {
      const data = await apiFetch("/api/professionals");
      renderResults(data);
    } catch (err) {
      resultsEl.innerHTML = "";
      emptyEl.textContent = "Could not load professionals: " + err.message;
      emptyEl.style.display = "block";
    }
  }
  async function loadBySpecialty(specialty) {
    try {
      const data = await apiFetch(`/api/professionals/specialty/${encodeURIComponent(specialty)}`);
      renderResults(Array.isArray(data) ? data : [data]);
    } catch (err) {
      resultsEl.innerHTML = "";
      emptyEl.textContent = "No professionals found for that specialty.";
      emptyEl.style.display = "block";
    }
  }
  document.getElementById("search-btn").addEventListener("click", () => {
    const value = document.getElementById("specialty-input").value.trim();
    if (value) loadBySpecialty(value); else loadAll();
  });
  document.getElementById("clear-btn").addEventListener("click", () => {
    document.getElementById("specialty-input").value = "";
    loadAll();
  });
  loadAll();
</script>
</body>
</html>
